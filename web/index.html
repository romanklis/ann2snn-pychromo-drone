<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>drone6dof · SNN / ANN / trainer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">ANN2SNN · 6-DoF drone</div>
      <div id="badges" class="badges"></div>
      <div class="controls">
        <details class="menu" id="menu-brains">
          <summary>Brains</summary>
          <div class="menu-body"><div id="picker" class="picker"></div></div>
        </details>
        <div class="goal">
          <span class="goal-label">scene</span>
          <select id="scene" class="goal-input"></select>
        </div>
        <div class="goal">
          <span class="goal-label">map</span>
          <select id="map-source" class="goal-input">
            <option value="slam" selected>SLAM</option>
            <option value="truth">truth</option>
          </select>
        </div>
        <div class="goal">
          <span class="goal-label">goal</span>
          <input id="gx" class="goal-input" type="number" step="0.1" />
          <input id="gy" class="goal-input" type="number" step="0.1" />
          <input id="gz" class="goal-input" type="number" step="0.1" />
          <button id="set-goal" title="Re-run at this goal">Set</button>
          <button id="reset-goal" title="Shipped goal (0, 0, 2.5)">Reset</button>
        </div>
        <details class="menu" id="menu-view">
          <summary>View</summary>
          <div class="menu-body">
            <label class="pick"><input type="checkbox" id="show-path" checked /> path</label>
            <div id="path-brains" class="picker" title="trajectories per model"></div>
            <label class="pick"><input type="checkbox" id="show-drone" checked /> drone</label>
            <div id="drone-brains" class="picker" title="drones per model"></div>
            <label class="pick"><input type="checkbox" id="show-scan" checked /> rays</label>
            <div id="scan-brains" class="picker" title="LiDAR rays per model"></div>
            <label class="pick"><input type="checkbox" id="show-spikes" checked /> spikes</label>
            <div id="spike-brains" class="picker" title="spike raster per model"></div>
            <div class="goal">
              <span class="goal-label">channels</span>
              <select id="raster-channels" class="goal-input">
                <option value="64">64</option>
                <option value="128">128</option>
                <option value="200" selected>200</option>
              </select>
            </div>
          </div>
        </details>
        <span id="goal-label" class="clock"></span>
        <span id="status" class="status"></span>
        <button id="play" title="Play / pause">Play</button>
        <span id="clock" class="clock">t = 0.00 s</span>
        <a id="extended-link" class="link" href="/extended">EXTENDED ↗</a>
      </div>
    </header>

    <main>
      <section id="stage" class="stage"></section>
      <aside class="side">
        <div class="card">
          <h3>SLAM map · what the drone knows <span id="slam-note" class="note"></span></h3>
          <canvas id="slam-map" width="320" height="320"></canvas>
          <div id="slam-metrics" class="pipeline"></div>
          <div id="slam-pipe" class="pipeline"></div>
        </div>
        <div class="card">
          <h3>Spike activity <span id="raster-note" class="note"></span></h3>
          <canvas id="raster" width="640" height="180"></canvas>
        </div>
        <div class="card">
          <h3>Control output ‖u‖ (m/s²)</h3>
          <div id="ctrl-chart" class="chart"></div>
        </div>
        <div class="card">
          <h3>Tracking · goal distance (m)</h3>
          <div id="track-chart" class="chart"></div>
        </div>
        <div class="card">
          <h3>Safety · clearance (m)</h3>
          <div id="clear-chart" class="chart"></div>
        </div>
      </aside>
    </main>

    <footer id="resultbar" class="resultbar"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
