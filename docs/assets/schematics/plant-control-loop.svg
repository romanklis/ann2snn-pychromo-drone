<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Plant and autopilot loop schematic placeholder">
  <rect width="960" height="540" fill="#0e141d"/>
  <rect x="10" y="10" width="940" height="520" fill="none" stroke="#22303c" stroke-width="2" rx="10"/>
  <text x="480" y="46" text-anchor="middle" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Plant + attitude autopilot</text>
  <text x="480" y="74" text-anchor="middle" fill="#e0a030" font-family="system-ui, sans-serif" font-size="14">SCHEMATIC PLACEHOLDER — replace with final artwork</text>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">
    <rect x="40" y="120" width="180" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="130" y="147" text-anchor="middle">u (accel demand)</text>
    <rect x="260" y="120" width="180" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="350" y="141" text-anchor="middle">F_des = m(u + g·ẑ)</text><text x="350" y="157" text-anchor="middle" font-size="11" fill="#7b8a99">→ R_d (heading blend)</text>
    <rect x="480" y="120" width="180" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="570" y="141" text-anchor="middle">SO(3) PD + filter</text><text x="570" y="157" text-anchor="middle" font-size="11" fill="#7b8a99">e_R, τ_att</text>
    <rect x="700" y="120" width="220" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="810" y="141" text-anchor="middle">mixer B⁻¹ + tanh</text><text x="810" y="157" text-anchor="middle" font-size="11" fill="#7b8a99">→ ω_target</text>

    <rect x="700" y="210" width="220" height="64" fill="#111823" stroke="#22303c" rx="6"/><text x="810" y="236" text-anchor="middle">motor (τ_e ZOH)</text><text x="810" y="254" text-anchor="middle" font-size="11" fill="#7b8a99">+ 4S battery / SoC</text>
    <rect x="480" y="210" width="180" height="64" fill="#111823" stroke="#22303c" rx="6"/><text x="570" y="236" text-anchor="middle">rotor + fuselage aero</text><text x="570" y="254" text-anchor="middle" font-size="11" fill="#7b8a99">C_T ω², k_h, C_D</text>
    <rect x="260" y="210" width="180" height="64" fill="#111823" stroke="#22303c" rx="6"/><text x="350" y="236" text-anchor="middle">rigid body</text><text x="350" y="254" text-anchor="middle" font-size="11" fill="#7b8a99">ω̇ = J⁻¹(τ_aero+τ_gyro)</text>
    <rect x="40" y="210" width="180" height="64" fill="#111823" stroke="#22303c" rx="6"/><text x="130" y="236" text-anchor="middle">integrate</text><text x="130" y="254" text-anchor="middle" font-size="11" fill="#7b8a99">500 Hz substeps</text>

    <rect x="260" y="330" width="440" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="480" y="357" text-anchor="middle">state [p, v] + hidden R, ω, ω_m, currents, SoC</text>
    <rect x="260" y="400" width="440" height="44" fill="#111823" stroke="#22303c" rx="6"/><text x="480" y="427" text-anchor="middle">telemetry: g-force, thrust, power, saturation, rpm…</text>
  </g>

  <g stroke="#22b8a6" stroke-width="2" fill="none" marker-end="url(#b)">
    <defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22b8a6"/></marker></defs>
    <path d="M220,142 L260,142"/>
    <path d="M440,142 L480,142"/>
    <path d="M660,142 L700,142"/>
    <path d="M810,164 L810,210"/>
    <path d="M700,242 L660,242"/>
    <path d="M480,242 L440,242"/>
    <path d="M260,242 L220,242"/>
    <path d="M130,274 L130,352 L260,352"/>
  </g>
</svg>
