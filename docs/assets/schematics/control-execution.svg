<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Control execution schematic placeholder">
  <rect width="960" height="540" fill="#0e141d"/>
  <rect x="10" y="10" width="940" height="520" fill="none" stroke="#22303c" stroke-width="2" rx="10"/>
  <text x="480" y="46" text-anchor="middle" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Controller dispatch and frame loop</text>
  <text x="480" y="74" text-anchor="middle" fill="#e0a030" font-family="system-ui, sans-serif" font-size="14">SCHEMATIC PLACEHOLDER — replace with final artwork</text>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">
    <rect x="40" y="110" width="880" height="150" fill="#111823" stroke="#22303c" rx="8"/>
    <text x="480" y="138" text-anchor="middle" fill="#7b8a99" font-size="12">make_controller(name, scene, limit)</text>
    <rect x="70" y="160" width="150" height="70" fill="#0e141d" stroke="#22303c" rx="6"/><text x="145" y="190" text-anchor="middle">ds_guidance</text><text x="145" y="210" text-anchor="middle" font-size="10" fill="#7b8a99">teacher</text>
    <rect x="240" y="160" width="130" height="70" fill="#0e141d" stroke="#22303c" rx="6"/><text x="305" y="190" text-anchor="middle">pid</text><text x="305" y="210" text-anchor="middle" font-size="10" fill="#7b8a99">baseline</text>
    <rect x="390" y="160" width="160" height="70" fill="#0e141d" stroke="#22303c" rx="6"/><text x="470" y="190" text-anchor="middle">ann / snn</text><text x="470" y="210" text-anchor="middle" font-size="10" fill="#7b8a99">end-to-end</text>
    <rect x="570" y="160" width="180" height="70" fill="#0e141d" stroke="#22303c" rx="6"/><text x="660" y="190" text-anchor="middle">field_ann / field_snn</text><text x="660" y="210" text-anchor="middle" font-size="10" fill="#7b8a99">structured field</text>
    <rect x="770" y="160" width="120" height="70" fill="#0e141d" stroke="#22303c" rx="6"/><text x="830" y="195" text-anchor="middle">weights/</text>

    <rect x="60" y="310" width="150" height="60" fill="#111823" stroke="#22303c" rx="6"/><text x="135" y="336" text-anchor="middle">controller.act</text><text x="135" y="354" text-anchor="middle" font-size="10" fill="#7b8a99">→ u (m/s²)</text>
    <rect x="250" y="310" width="150" height="60" fill="#111823" stroke="#22303c" rx="6"/><text x="325" y="336" text-anchor="middle">plant.step</text><text x="325" y="354" text-anchor="middle" font-size="10" fill="#7b8a99">hidden truth</text>
    <rect x="440" y="310" width="150" height="60" fill="#111823" stroke="#22303c" rx="6"/><text x="515" y="336" text-anchor="middle">sensors.measure</text><text x="515" y="354" text-anchor="middle" font-size="10" fill="#7b8a99">k+1</text>
    <rect x="630" y="310" width="150" height="60" fill="#111823" stroke="#22303c" rx="6"/><text x="705" y="336" text-anchor="middle">UKF.step</text><text x="705" y="354" text-anchor="middle" font-size="10" fill="#7b8a99">estimate</text>
    <rect x="60" y="410" width="720" height="46" fill="#111823" stroke="#22303c" rx="6"/><text x="420" y="438" text-anchor="middle" font-size="12">dashboard: POST /api/benchmark → run_benchmark → run_controller (fresh plant each)</text>
    <text x="480" y="500" text-anchor="middle" font-size="12" fill="#e0a030">No independent safety layer: limits = command clip + plant saturation only</text>
  </g>

  <g stroke="#22b8a6" stroke-width="2" fill="none" marker-end="url(#e)">
    <defs><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22b8a6"/></marker></defs>
    <path d="M210,340 L250,340"/>
    <path d="M400,340 L440,340"/>
    <path d="M590,340 L630,340"/>
    <path d="M705,310 L705,260 L135,260 L135,310"/>
  </g>
</svg>
