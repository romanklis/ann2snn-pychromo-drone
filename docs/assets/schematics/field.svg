<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Potential field schematic placeholder">
  <rect width="960" height="540" fill="#0e141d"/>
  <rect x="10" y="10" width="940" height="520" fill="none" stroke="#22303c" stroke-width="2" rx="10"/>
  <text x="480" y="46" text-anchor="middle" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Trajectory-anchored potential field and DS modulation</text>
  <text x="480" y="74" text-anchor="middle" fill="#e0a030" font-family="system-ui, sans-serif" font-size="14">SCHEMATIC PLACEHOLDER — replace with final artwork</text>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">
    <rect x="40" y="110" width="270" height="380" fill="#111823" stroke="#22303c" rx="8"/>
    <text x="175" y="138" text-anchor="middle" fill="#7b8a99" font-size="12">basis anchored to nominal-DS preview</text>
    <path d="M70,430 C140,430 160,300 190,240 C210,200 240,180 280,175" fill="none" stroke="#4f8cff" stroke-width="2"/>
    <text x="285" y="172" font-size="11" fill="#4f8cff">v_nom preview</text>
    <g fill="#888">
      <circle cx="110" cy="360" r="4"/><circle cx="110" cy="330" r="4"/>
      <circle cx="160" cy="265" r="4"/><circle cx="160" cy="235" r="4"/>
      <circle cx="230" cy="190" r="4"/><circle cx="230" cy="215" r="4"/>
    </g>
    <text x="175" y="466" text-anchor="middle" font-size="11" fill="#7b8a99">3 centres per point (on + ±lateral)</text>

    <rect x="345" y="110" width="270" height="380" fill="#111823" stroke="#22303c" rx="8"/>
    <text x="480" y="138" text-anchor="middle" fill="#7b8a99" font-size="12">U_obs = Σ a_k φ_k,  F_obs = −∇U_obs</text>
    <ellipse cx="480" cy="290" rx="100" ry="130" fill="none" stroke="#f72585" opacity="0.5"/>
    <ellipse cx="480" cy="290" rx="60" ry="80" fill="none" stroke="#f72585" opacity="0.7"/>
    <line x1="480" y1="420" x2="480" y2="170" stroke="#f72585" stroke-width="2" marker-end="url(#d)"/>
    <text x="500" y="180" font-size="11" fill="#f72585">F_obs</text>
    <text x="480" y="466" text-anchor="middle" font-size="11" fill="#7b8a99">a = ReLU(net) ∈ R_+^K, analytic gradient</text>

    <rect x="650" y="110" width="270" height="380" fill="#111823" stroke="#22303c" rx="8"/>
    <text x="785" y="138" text-anchor="middle" fill="#7b8a99" font-size="12">Billard modulation (M → I away)</text>
    <line x1="690" y1="300" x2="880" y2="300" stroke="#4f8cff" stroke-width="2"/>
    <text x="700" y="292" font-size="11" fill="#4f8cff">v_nom</text>
    <line x1="785" y1="390" x2="785" y2="230" stroke="#f72585" stroke-width="2"/>
    <text x="795" y="380" font-size="11" fill="#f72585">n</text>
    <line x1="785" y1="300" x2="880" y2="240" stroke="#22b8a6" stroke-width="2"/>
    <text x="850" y="232" font-size="11" fill="#22b8a6">v_des</text>
    <text x="785" y="466" text-anchor="middle" font-size="11" fill="#7b8a99">impedance → u, then plant</text>
  </g>

  <g stroke="#22b8a6" stroke-width="2" fill="none" marker-end="url(#d)">
    <defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22b8a6"/></marker></defs>
    <path d="M310,300 L345,300"/>
    <path d="M615,300 L650,300"/>
  </g>
</svg>
